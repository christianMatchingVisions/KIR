<!doctype html>
<!--
  @custom — generic site OG card source for net-new pages (e.g. /oppaat/,
  /toimitus/) that have no per-page social image. Rendered to
  public/og/default.png (1200x630) by scripts/og/render-og.py.

  Brand tokens mirror src/styles/base.css: --navy #0b1f3a, --brand #1f6fe5,
  --cta #ffce32. No external assets — fully self-contained so the headless
  render needs no network.
-->
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background:
          radial-gradient(1100px 700px at 82% -10%, #16386b 0%, rgba(22, 56, 107, 0) 60%),
          linear-gradient(135deg, #0b1f3a 0%, #102a4f 100%);
        background-color: #0b1f3a;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        right: -160px;
        top: -160px;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(31, 111, 229, 0.55) 0%, rgba(31, 111, 229, 0) 70%);
      }
      .brandrow { display: flex; align-items: center; gap: 22px; }
      .badge {
        width: 92px; height: 92px; border-radius: 24px;
        background: linear-gradient(135deg, #1f6fe5 0%, #0b1f3a 100%);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 18px 40px -12px rgba(31, 111, 229, 0.7);
      }
      .badge svg { display: block; }
      .wordmark { line-height: 1; }
      .wordmark .name {
        font-size: 40px; font-weight: 800; letter-spacing: 1px; color: #ffffff;
      }
      .wordmark .sub {
        margin-top: 8px; font-size: 18px; font-weight: 600;
        letter-spacing: 3px; text-transform: uppercase; color: #9cc2ff;
      }
      .headline {
        max-width: 980px;
      }
      .headline h1 {
        font-size: 72px; font-weight: 800; line-height: 1.08;
        letter-spacing: -1px;
      }
      .headline .accent { color: #ffce32; }
      .footer {
        display: flex; align-items: center; justify-content: space-between;
      }
      .url { font-size: 26px; font-weight: 700; color: #c3d2e8; }
      .age {
        font-size: 22px; font-weight: 800; color: #0e1f3a;
        background: #ffce32; padding: 10px 22px; border-radius: 999px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <div class="brandrow">
      <div class="badge">
        <svg viewBox="0 0 40 40" width="56" height="56" role="img" aria-label="KIR">
          <path d="M20 11v18M11 20h18" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" />
        </svg>
      </div>
      <div class="wordmark">
        <div class="name">KASINOT</div>
        <div class="sub">Ilman rekisteröitymistä</div>
      </div>
    </div>

    <div class="headline">
      <h1>Riippumattomat <span class="accent">kasinoarvostelut</span> ja vertailut suomalaisille pelaajille</h1>
    </div>

    <div class="footer">
      <div class="url">kasinotilmanrekisteroitymista.com</div>
      <div class="age">18+</div>
    </div>
  </body>
</html>
